<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Cinta 4 Bulan - Aira & Shivam ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="stars-bg"></div>

    <!-- Header Controls -->
    <header class="top-nav">
        <div class="book-info">
            <span class="book-title">📖 Buku Cinta Aira & Shivam</span>
            <span id="page-indicator" class="page-num">Halaman 1 / 150</span>
        </div>
        <div class="nav-actions">
            <button id="toggle-lang-btn" class="cute-btn">🌐 EN Text: ON</button>
            <button id="bg-music-btn" class="cute-btn">🎵 Musik: Off</button>
            <button id="restart-book-btn" class="cute-btn">↺ Ulang dari Awal</button>
        </div>
    </header>

    <!-- Main 3D Interactive Book Stage -->
    <main class="book-stage">
        <button class="nav-arrow left-arrow" id="prev-page-btn" title="Halaman Sebelumnya">❮</button>
        
        <div class="book-wrapper" id="book-container">
            <!-- 3D Book Pages dynamically generated via script.js -->
        </div>

        <button class="nav-arrow right-arrow" id="next-page-btn" title="Halaman Berikutnya">❯</button>
    </main>

    <!-- Global Modal for Mini-Games and Surprises -->
    <div id="game-modal" class="modal-overlay hidden">
        <div class="modal-box glass-card">
            <button id="close-modal-btn" class="close-x">&times;</button>
            <div id="modal-game-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
